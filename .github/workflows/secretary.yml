name: 비서

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 부하에 따라 다소 밀릴 수 있음)
  workflow_dispatch:          # 수동 실행 버튼

# 이전 실행이 아직 돌고 있으면 겹치지 않게 한다
concurrency:
  group: secretary
  cancel-in-progress: false

permissions:
  contents: write             # state.json 을 커밋해 진행 상황을 남기기 위함

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 메일 감시
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python watch_mail.py

      - name: 진행 상황 저장
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "secretary-bot"
            git config user.email "secretary-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          else
            echo "변경 없음"
          fi
